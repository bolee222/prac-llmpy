<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Relationship Explorer</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <div class="header-row header-row--gallery">
        <a class="link-button link-button--gallery" href="/">&#8592;</a>
      </div>
      <p class="gallery-label">Gallery {{ gallery_id }}</p>
    </header>

    <main>
      <section class="gallery">
        {% for card in cards %}
        <label class="card">
          <input type="checkbox" name="selected" value="{{ card.id }}" />
          <img src="{{ card.url }}" alt="{{ card.title }}" />
          <div class="card-body">
            <h3>{{ card.title }}</h3>
          </div>
        </label>
        {% endfor %}
      </section>

      <section class="controls">
        <div class="prompt">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" placeholder="Enter the prompt you want to run..."></textarea>
        </div>
        <button id="submit" type="button">Run Relationship</button>
        <p id="status" role="status"></p>
      </section>

    </main>

    <div class="modal" id="result-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <h2 id="modal-title">Relationship Result</h2>
          <button class="modal-close" type="button" data-close aria-label="Close dialog">
            ×
          </button>
        </header>
        <div class="modal-body">
          <div class="message-box">
            <h3>Relationship Text</h3>
            <p id="relationship"></p>
          </div>
          <div class="modal-section">
            <h3>Parsed JSON</h3>
            <pre id="parsed"></pre>
          </div>
          <div class="modal-section">
            <h3>Diagram Output</h3>
            <pre id="diagram"></pre>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
